apply plugin: 'com.android.application'

android {
    namespace 'com.mohammedaqeel.sarfitadmin'
    compileSdk 34

    defaultConfig {
        applicationId "com.mohammedaqeel.sarfitadmin"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            storeFile file("../release.keystore")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: "SarfitAdminBuild123!"
            keyAlias System.getenv("KEY_ALIAS") ?: "sarfitadminkey"
            keyPassword System.getenv("KEY_PASSWORD") ?: "SarfitAdminBuild123!"
        }
    }

    buildTypes {
        debug { minifyEnabled false }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation platform('com.google.firebase:firebase-bom:33.1.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
}

apply plugin: 'com.google.gms.google-services'
